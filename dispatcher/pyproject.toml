[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mussel-dispatcher"
version = "0.1.0"
description = "Streaming slide dispatcher for mussel-nf"
requires-python = ">=3.10"
dependencies = [
    "nextflow-turret>=0.1.0",
    "psycopg[binary]",
    "pyyaml",
    "boto3",
    "pandas",
    "numpy",
    "torch",
    "h5py",
    "webdataset",
    "requests",
]

[project.scripts]
mussel-dispatcher      = "mussel_dispatcher.__main__:main"
mussel-dashboard       = "mussel_dispatcher.dashboard.server:main"
mussel-append-wds      = "mussel_dispatcher.tcga.append_wds:main"
mussel-update-status   = "mussel_dispatcher.tcga.update_status:main"
mussel-prepare-samples = "mussel_dispatcher.tcga.prepare_samples:main"
mussel-sync-inventory  = "mussel_dispatcher.tcga.sync_inventory:main"
mussel-sync-databricks = "mussel_dispatcher.tcga.sync_databricks:main"
mussel-remote-agent    = "mussel_dispatcher.remote:agent_main"
mussel-release         = "mussel_dispatcher.release:main"
mussel-release-agent   = "mussel_dispatcher.release_agent:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["mussel_dispatcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises several dispatcher components together",
    "e2e: end-to-end runs of the dispatcher against stub pipelines",
]
