name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  # ── Python unit tests ──────────────────────────────────────────────────────
  pytest:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pytest webdataset h5py requests boto3
          pip install -e dispatcher/

      - name: Run pytest
        run: pytest tests/ -v --ignore=tests/testdata

  # ── Dispatcher unit tests (production runs Python 3.12) ───────────────────
  dispatcher-tests:
    name: Dispatcher unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dispatcher and test dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pytest webdataset h5py requests boto3 pyarrow databricks-sdk
          # Production runs nextflow-turret from this commit (agent/tower-compatibility);
          # PyPI 0.1.0 predates its 16-character Tower workflow IDs.
          pip install "nextflow-turret @ git+https://github.com/msk-mind/nextflow-turret@7df7717"
          pip install -e dispatcher/

      - name: Run dispatcher tests
        working-directory: dispatcher
        run: pytest tests/ -q

  # ── Dispatcher syntax on the oldest supported Pythons (requires-python >=3.10) ─
  dispatcher-syntax:
    name: Dispatcher syntax (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every dispatcher module
        run: python -m compileall -q dispatcher/mussel_dispatcher dispatcher/scripts

  # ── Linear probe integration test (no GPU, no real slides) ────────────────
  nf-test-linear-probe:
    name: nf-test — linear probe
    runs-on: ubuntu-latest

    env:
      NXF_ANSI_LOG: false
      NXF_OPTS: "-Xmx2g"
      NXF_HOME: /tmp/nf_ci_home  # isolate CI secrets from user home

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"

      - name: Install Mussel and dependencies
        run: |
          pip install pandas pyarrow
          python -m venv $HOME/.mussel-venv
          source $HOME/.mussel-venv/bin/activate
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "mussel @ git+https://github.com/pathology-data-mining/Mussel.git@v1.3.3"
          echo "MUSSEL_VENV=$HOME/.mussel-venv" >> $GITHUB_ENV

      - name: Run linear probe integration test
        run: |
          source $MUSSEL_VENV/bin/activate
          nf-test test tests/linear_probe.nf.test --profile test_linear_probe

  # ── Main pipeline stub test (no GPU, no mussel CLI) ───────────────────────
  nf-test-stub:
    name: nf-test — pipeline stub
    runs-on: ubuntu-latest

    env:
      NXF_ANSI_LOG: false
      NXF_OPTS: "-Xmx2g"
      NXF_HOME: /tmp/nf_ci_home  # isolate CI secrets from user home

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python stub dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install h5py numpy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"

      - name: Generate tests/test.csv
        run: |
          echo "slide_id,slide_path" > tests/test.csv
          echo "948176,${GITHUB_WORKSPACE}/tests/testdata/948176.svs" >> tests/test.csv

      - name: Set dummy HF_TOKEN secret for stub run
        run: nextflow secrets set HF_TOKEN "stub_ci_token_not_real"

      - name: Run pipeline stub test
        run: |
          nf-test test tests/pipeline_stub.nf.test --profile test_stub

  # ── All other stub tests (two-step, filter, WDS, WDS-grouped, CLIP, multi-slide) ──
  nf-test-stub-variants:
    name: nf-test -- pipeline stub variants
    runs-on: ubuntu-latest

    env:
      NXF_ANSI_LOG: false
      NXF_OPTS: "-Xmx2g"
      NXF_HOME: /tmp/nf_ci_home  # isolate CI secrets from user home

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python stub dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install h5py numpy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"

      - name: Generate test samplesheets
        run: |
          SLIDE="${GITHUB_WORKSPACE}/tests/testdata/948176.svs"
          SLIDE_B="${GITHUB_WORKSPACE}/tests/testdata/948176_b.svs"
          printf 'slide_id,slide_path\n948176,%s\n' "$SLIDE" > tests/test.csv
          printf 'slide_id,slide_path,oncotree_code\n948176,%s,BRCA\n' "$SLIDE" > tests/test_oncotree.csv
          printf 'slide_id,slide_path,sample_id\n948176_A,%s,PATIENT_STUB\n948176_B,%s,PATIENT_STUB\n' "$SLIDE" "$SLIDE_B" > tests/test_multi_slide.csv

      - name: Set dummy HF_TOKEN secret for stub run
        run: nextflow secrets set HF_TOKEN "stub_ci_token_not_real"

      - name: Run stub variant tests
        run: |
          nf-test test \
            tests/pipeline_stub_two_step.nf.test \
            tests/pipeline_stub_two_step_titan.nf.test \
            tests/pipeline_stub_filter.nf.test \
            tests/pipeline_stub_wds.nf.test \
            tests/pipeline_stub_wds_grouped.nf.test \
            tests/pipeline_stub_clip.nf.test \
            tests/pipeline_stub_multi_slide.nf.test \
            tests/pipeline_stub_multi_model.nf.test \
            tests/pipeline_stub_grid_from_primary.nf.test \
            tests/pipeline_stub_grid_from_primary_batched.nf.test \
            tests/pipeline_stub_one_step_partial.nf.test \
            tests/pipeline_stub_one_step_slide_encoders.nf.test \
            tests/pipeline_stub_one_step_slide_override.nf.test

      - name: Run non-stub FEATURIZE script regression test
        run: |
          nf-test test \
            tests/pipeline_real_featurize.nf.test \
            tests/pipeline_real_featurize_multi.nf.test \
            tests/pipeline_real_featurize_partial.nf.test \
            tests/pipeline_real_featurize_partial_slide.nf.test \
            tests/abmil_features_suffix.nf.test

      # Production cluster + slurm profiles against a fake Slurm that fails submissions;
      # its watchdog turns a hung run into a failure.
      - name: Run Slurm submission-failure test (fake Slurm)
        timeout-minutes: 20
        run: PATH="$GITHUB_WORKSPACE/tests/fake_slurm:$PATH" nf-test test tests/pipeline_fake_slurm.nf.test

      # The driver watch beside real Nextflow (lost job failed and retried) and the remote
      # agent classifying runs Nextflow aborted on Slurm failures (~1 min).
      - name: Run live driver-watch tests (Nextflow + fake Slurm)
        timeout-minutes: 20
        run: |
          pip install pytest -e dispatcher/
          cd dispatcher && pytest tests/test_driver_watch.py -q -m live_nextflow

  # ── TCGA scripts integration: stub pipeline output → append_wds ────────
  nf-test-stub-tcga:
    name: nf-test — TCGA scripts integration (stub)
    runs-on: ubuntu-latest

    env:
      NXF_ANSI_LOG: false
      NXF_OPTS: "-Xmx2g"
      NXF_HOME: /tmp/nf_ci_home  # isolate CI secrets from user home

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install h5py numpy pandas webdataset
          pip install -e dispatcher/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"

      - name: Generate tests/test.csv
        run: |
          echo "slide_id,slide_path" > tests/test.csv
          echo "948176,${GITHUB_WORKSPACE}/tests/testdata/948176.svs" >> tests/test.csv

      - name: Set dummy HF_TOKEN secret for stub run
        run: nextflow secrets set HF_TOKEN "stub_ci_token_not_real"

      - name: Run TCGA integration stub test
        run: nf-test test tests/pipeline_stub_tcga.nf.test --profile test_stub
