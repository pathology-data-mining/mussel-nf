tiling:
  seg_config_group: 'biopsy'
  remove_penmarks: true    # remove pen marks (conservative; pen marks only)
  remove_artifacts: false  # do NOT remove artifacts (too stringent for TCGA)
featurize:
  model_types:
    - hoptimus1
    - titan_slide
  slide_max_patches: 4096
  model_precision_overrides:
    hoptimus1: bfloat16
use_one_step_workflow: false  # two-step: TESSELLATE (GPU, neural seg) then FEATURIZE_BATCH (GPU)
publish_mode: symlink
