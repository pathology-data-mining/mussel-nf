# TCGA Feature Extraction — Run Configuration
# ============================================
# Used by: scripts/tcga/tcga_run.py
#
# Copy this file, fill in your paths and settings, then run:
#
#   # Incremental run (cron):
#   python scripts/tcga/tcga_run.py --config /path/to/tcga_run_config.yaml
#
#   # Initial full load (chunked, resumable):
#   python scripts/tcga/tcga_run.py --config /path/to/tcga_run_config.yaml --initial-run
#
#   # Process specific project first:
#   python scripts/tcga/tcga_run.py --config /path/to/tcga_run_config.yaml \
#       --initial-run --project TCGA-BRCA
#
#   # Dry run:
#   python scripts/tcga/tcga_run.py --config /path/to/tcga_run_config.yaml --dry-run

# Paths to the shared state files written by the pipeline scripts.
inventory_csv: /data/tcga/tcga_inventory.csv
status_csv:    /data/tcga/tcga_status.csv
samples_csv:   /data/tcga/samples_to_run.csv
run_log:       /data/tcga/tcga_run_log.jsonl

# GDC inventory cache settings
gdc:
  # How old the inventory CSV can be before triggering a re-fetch.
  # Set to 0 to always fetch. Override with --force-sync.
  max_age_hours: 24

download:
  # Root directory for slides downloaded by DOWNLOAD_SLIDE (Nextflow process).
  # Files land at <local_dir>/<file_id>/<file_name>.
  # Also used by --delete-slides to reclaim disk after WDS append.
  local_dir: /data/tcga-slides

# Slide filtering and path resolution
slides:
  project: null                  # null = all TCGA projects; or e.g. "TCGA-BRCA,TCGA-GBM"
  # Slide type filter. Supports prefix matching and comma-separated values:
  #   'all'    — every slide type (DX, TS, BS, MS, …)
  #   'DX'     — all diagnostic types (DX1–DX17); these are on S3
  #   'DX1'    — primary diagnostic only
  #   'DX1,TS1'— comma-separated list
  # Slides not found on S3 are automatically flagged for download.
  slide_type: DX
  skip_done: true

  # Path resolution priority: local_slides_dir first, then s3_base.
  # Set a value to null to skip that source.
  local_slides_dir: /data/tcga-slides        # check local disk first
  s3_base: s3://pathology/TCGA              # then check S3
  s3_endpoint: http://pmindecs.mskcc.org:9020  # ECS/MinIO endpoint (omit for AWS)
  # S3 credentials for the ECS endpoint. Leave null to use ECS_ACCESS_KEY /
  # ECS_SECRET_KEY environment variables (recommended — avoids secrets in config).
  s3_access_key: null
  s3_secret_key: null
  check_s3_exists: true                      # verify via S3 listing before including path
                                             # (set false to assume all S3 paths exist)

# Initial run settings (only used with --initial-run flag)
initial_run:
  chunk_size: 500                # slides per loop iteration (~550 GB disk per chunk)
  delete_slides_after_chunk: true  # free disk after each chunk's WDS append
  project: null                  # null = all; or "TCGA-BRCA,TCGA-GBM" to prioritize

# Nextflow pipeline parameters
#
# model_types and tiling/featurize settings are driven by params_file (a
# standard nextflow params YAML).  The orchestrator deep-merges TCGA-specific
# overrides on top of that file, so you only need one place to configure models.
#
# Example: to run ctranspath + uni2h, create a params YAML:
#   featurize:
#     model_types: [ctranspath, uni2h]
# and point params_file at it below.
#
# If params_file is null, the nextflow.config defaults apply
# (featurize.model_types: [ctranspath, h0mini, uni2h]).
nextflow:
  profile: cluster,slurm,apptainer
  outdir: /data/tcga-results     # nextflow writes .pt and .h5 files here
  params_file: null              # path to a nextflow params YAML (source of truth for model_types)
  extra_args: []                 # any additional nextflow CLI flags
  # Download params passed to the DOWNLOAD_SLIDE Nextflow process.
  # local_dir should match download.local_dir above.
  params:
    download:
      local_dir: /data/tcga-slides
      gdc_token_file: ~/.gdc-token   # optional; needed for controlled-access data
      n_connections: 8               # parallel connections per gdc-client invocation

# WDS shard output
# Layout: <dest>/<model>/<project_id>/000000.tar, 000001.tar, ...
#         <dest>/<model>/wds_index.json
#
# Training example (WebDataset):
#   import webdataset as wds
#   ds = wds.ResampledShards("s3://pathology/tcga-features/wds/ctranspath/TCGA-BRCA/*.tar")
wds:
  dest: s3://pathology/tcga-features/wds    # local path or s3://bucket/prefix
  staging_dir: /data/tcga-wds-staging       # local staging for unsealed S3 shards
  max_shard_bytes: 2147483648               # 2 GB per shard
  shard_prefix: ""

# Databricks sync (set volume_path to enable; credentials via env vars)
# Set DATABRICKS_HOST and DATABRICKS_TOKEN in the environment, or use
# the --databricks-host / --token CLI flags of tcga_sync_databricks.py.
databricks:
  host: null                     # e.g. https://<workspace>.azuredatabricks.net
  volume_path: null              # e.g. /Volumes/catalog/schema/volume/tcga_inventory.parquet
  job_id: null                   # optional Databricks job ID to trigger after upload
