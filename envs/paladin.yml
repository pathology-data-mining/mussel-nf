name: paladin
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pytorch=2.4.1
  - torchvision
  # - lightning=2.0
  - pytorch-cuda=12.1
  - scikit-learn
  - h5py
  - pip
  - seaborn
  - pip:
    - -e .[dev]
    - flash-attn
    - numpy<2.0
    - torchmetrics==1.4.2
    - hydra-submitit-launcher
    - statsmodels
    - torchscale
    - fastparquet
    - rpy2
    - webdataset
