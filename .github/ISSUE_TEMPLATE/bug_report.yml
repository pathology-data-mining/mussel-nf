name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: input
    id: nextflow-version
    attributes:
      label: Nextflow version
      description: Output of `nextflow -v`
      placeholder: "e.g. 24.10.2"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Execution profile
      options:
        - Docker
        - Apptainer
        - Conda
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04, RHEL 8"
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: The `nextflow run` command (omit any secrets)
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error
      description: Paste relevant log lines or error messages
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config or params
      description: Paste the relevant section of your `nextflow.config` or params file (omit secrets/paths)
      render: yaml
