# mussel-dispatcher configuration
# Copy this file and edit paths before running.
# All /path/to/... entries are placeholders — replace with absolute paths for your site.

repo_dir: /path/to/mussel-nf          # root of this repository checkout
nextflow_profiles: cluster,conda
outdir: /path/to/results              # nextflow --outdir; manifest CSVs are written here
work_base_dir: /path/to/work/dispatcher
dispatch_dir: /path/to/dispatcher/batches
state_dir: /path/to/dispatcher/state
log_dir: /path/to/dispatcher/logs

# Parallelism
max_concurrent_runs: 2

# Batching
batch_size: 20           # dispatch when this many slides accumulate
min_batch_size: 1        # don't dispatch fewer than this (unless forced on shutdown)
max_wait_seconds: 300    # dispatch after this many seconds regardless of batch_size

# Behaviour
retry_failed: true       # re-queue slides whose batch failed on restart
cleanup_work_dir: false  # delete per-batch work/ dirs after success
# combined_manifest_path: /path/to/results/manifest-combined.csv
#   ^ defaults to {outdir}/manifest-combined.csv if not set

# Optional: run commands after each successful Nextflow batch.
# Template vars: {batch_csv}, {batch_id}, {outdir}, {repo_dir}
# post_batch_hooks:
#   - command: "python {repo_dir}/scripts/tcga/tcga_append_wds.py"
#     args:
#       - "--pt-dir={outdir}/features/ctranspath/pt"
#       - "--h5-dir={outdir}/features/ctranspath/tile_h5"
#       - "--wds-dest=s3://your-bucket/wds/ctranspath"
#       - "--slide-ids-csv={batch_csv}"

watchers:
  - type: local
    path: /path/to/incoming/slides
    poll_interval_seconds: 60
    extensions: [.svs, .tiff, .tif, .ndpi, .scn]
    recursive: true
    stability_wait_seconds: 30   # seconds between two identical size+mtime polls
    min_file_size_mb: 10         # skip files smaller than this

  # Uncomment and edit to add an S3 (or on-prem ECS) watcher:
  # - type: s3
  #   bucket: my-bucket
  #   prefix: incoming/slides/
  #   poll_interval_seconds: 120
  #   extensions: [.svs, .ndpi]
  #   min_file_size_bytes: 10000000
  #   # aws_profile: my-profile
  #   # endpoint_url: http://pmindecs.mskcc.org:9020

  # Uncomment to watch TCGA GDC for new slides.
  # See dispatcher/tcga_dispatcher.yaml for a fully annotated TCGA example.
  #
  # - type: tcga
  #   inventory_csv: /path/to/tcga_inventory.csv   # managed by tcga_sync_inventory.py
  #   status_csv: /path/to/tcga_status.csv         # managed by tcga_update_status.py
  #   results_dir: /path/to/results                # nextflow outdir (same as above)
  #   model: ctranspath                            # model to check for completed slides
  #   local_slides_dir: /path/to/slides            # where .svs files live (or will be downloaded)
  #   # s3_base: s3://bucket/slides                # alternative / fallback to local
  #   slide_type: DX1                              # DX1, DX2, or all
  #   # project: TCGA-BRCA                         # restrict to one project; omit for all
  #   poll_interval_seconds: 3600
  #   gdc_max_age_hours: 24.0                      # re-use cached inventory if younger than this
  #   download_enabled: false                      # set true to auto-download via gdc-client
  #   download_dir: /path/to/downloads
  #   download_concurrency: 4
  #   # gdc_token_file: /path/to/gdc-user-token.txt
